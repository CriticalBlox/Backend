name: Critical_blox_ci_backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t critical-blox-api .

  test-unitaire:
    runs-on: ubuntu-latest
    needs: docker-build

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t critical-blox-api .

      - name: Run tests
        run: |
          docker run --rm --network host \
            -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/test_db \
            -e SECRET_KEY=test_secret_key \
            -e ALGORITHM=HS256 \
            -e ACCESS_TOKEN_EXPIRE_MINUTES=60 \
            -e API_KEY=test_api_key \
            critical-blox-api sh -c "
              alembic upgrade head &&
              python -m pytest -v
            "