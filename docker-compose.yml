services:
  app:
    depends_on:
      - postgres
    build:
      context: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    networks:
      - backend
    env_file:
      - .env

  postgres:
    image: postgres:16
    env_file:
      - .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - backend

networks:
  backend:

volumes:
  pg_data: